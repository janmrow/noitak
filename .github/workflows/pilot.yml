name: Verification and release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-symbolic.txt
      - run: npm test
      - run: npm run test:symbolic
      - run: npm run pilot -- build/pilot
      - run: npm run pilot:support -- build/support
      - run: npm run pilot:batch -- build/batch
      - run: npm run release:check -- build/distribution
      - uses: actions/upload-artifact@v4
        with:
          name: noitak-distribution
          path: build/distribution/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-reviews
          path: |
            build/pilot/
            build/support/
            build/batch/
